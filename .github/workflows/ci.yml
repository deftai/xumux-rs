name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: ["--all-features", "--no-default-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Debug test builds keep overflow checks on, so an arithmetic underflow fails a test
      # rather than wrapping.
      - run: cargo test ${{ matrix.features }} --all-targets
        if: matrix.features == '--all-features'
      - run: cargo test ${{ matrix.features }} --lib --test session --test vectors --test interop
        if: matrix.features == '--no-default-features'

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --lib --no-default-features -- -D warnings

  interop:
    name: interop (libxumux-go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: interop/go/go.mod
          cache-dependency-path: interop/go/go.sum
      - run: go build -o "$RUNNER_TEMP/interop-peer" .
        working-directory: interop/go
      - run: cargo test --test interop
        env:
          XUMUX_GO_PEER: ${{ runner.temp }}/interop-peer

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: deftai/xumux
          path: spec
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --examples
      - run: python3 -I spec/conformance/behaviour/run.py --features core,pipe -- target/debug/examples/conformance_adapter
