[package]
name = "xumux"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
libc = "0.2.191"
quinn = { version = "0.11.12", optional = true }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "io-util", "io-std", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", optional = true }
wtransport = { version = "0.7.2", optional = true, features = ["self-signed"] }

[dev-dependencies]
futures-util = "0.3.34"
hex = "0.4.3"
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["process"] }
tokio-tungstenite = "0.30"

[features]
default = ["websocket", "quic", "webtransport"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]
quic = ["dep:quinn"]
webtransport = ["quic", "dep:wtransport"]
